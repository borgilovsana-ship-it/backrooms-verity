<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Бэкрумс с Верити</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.controls{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,24px);padding:16px;width:100%}
button{border:2px solid #ffffff55;border-radius:20px;background:#202020;color:#fff;min-height:76px;min-width:76px;padding:12px;font-size:clamp(28px,6vw,44px);touch-action:manipulation;cursor:pointer;box-shadow:0 5px 0 #090909;}
#clap{font-size:clamp(17px,3.4vw,24px);font-weight:800;min-width:145px;background:#f0d45c;color:#17130a;border-color:#fff0a0}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #090909}
#message{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;color:#ddd;font-size:14px;min-height:22px}
@media(max-width:380px){.controls{gap:8px}button{min-width:62px;min-height:68px;padding:8px}#clap{min-width:125px}}
</style>
</head>
<body>
<div id="message" aria-live="polite"></div>
<div class="controls">
  <button id="leftHand" aria-label="Левая рука">🫸</button>
  <button id="clap">👏 ХЛОПНУТЬ</button>
  <button id="rightHand" aria-label="Правая рука">🫷</button>
</div>
<script>
const message=document.querySelector('#message');
let clapCount=0;
document.querySelector('#clap').addEventListener('click',()=>{
  clapCount++;
  message.textContent='ХЛОПОК! '+clapCount;
  if(navigator.vibrate) navigator.vibrate(70);
});
document.querySelector('#leftHand').addEventListener('click',()=>{message.textContent='🫸';});
document.querySelector('#rightHand').addEventListener('click',()=>{message.textContent='🫷';});
</script>
</body>
</html>
