<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17150e">
<title>Бэкрумс с Верити</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17150e;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-shadow:0 2px 5px #000}
.pill{background:#111b;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:8px 11px;font-size:13px;backdrop-filter:blur(6px)}
#status{max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#joystick{position:absolute;left:20px;bottom:22px;width:124px;height:124px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff70;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:52px;height:52px;border-radius:50%;left:34px;top:34px;background:#fff9;border:2px solid white;box-shadow:0 2px 10px #0008}
#lookHint{position:absolute;right:14px;bottom:22px;padding:12px 14px;background:#1118;border-radius:12px;font-size:12px;color:#fff;max-width:34%;text-align:center}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#111a,#000b);z-index:5}
.dialog{max-width:420px;width:100%;text-align:center;background:#171717ed;border:1px solid #ffffff35;border-radius:20px;padding:24px;box-shadow:0 12px 50px #0008}
h1{font-size:clamp(24px,4vw,38px);margin:0 0 8px}p{color:#ddd;line-height:1.45}
button{border:0;border-radius:13px;background:#d9c66a;color:#17150e;font-weight:800;font-size:16px;padding:13px 18px;min-height:48px}
.small{font-size:12px;color:#bbb}
#rotate{display:none;position:fixed;inset:0;z-index:8;background:#17150e;align-items:center;justify-content:center;text-align:center;padding:30px}
@media (orientation:portrait){#rotate{display:flex}#hud{display:none}}
@media (orientation:landscape){#rotate{display:none}}
@media (max-height:430px){#joystick{width:96px;height:96px;bottom:12px;left:14px}#stick{width:42px;height:42px;left:25px;top:25px}#lookHint{bottom:12px;right:12px}.pill{padding:6px 9px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top"><div class="pill">🟨 БЭКРУМС · С ВЕРИТИ</div><div id="status" class="pill">Загрузка карты…</div><button id="full" style="pointer-events:auto;padding:8px 11px;min-height:0;font-size:13px">⛶ Экран</button></div>
  <div id="joystick" aria-label="Джойстик движения"><div id="stick"></div></div>
  <div id="lookHint">Проводи пальцем по правой части экрана, чтобы осматриваться</div>
</div>
<div id="start"><div class="dialog"><h1>Бэкрумс с Верити</h1><p>Исследуй жёлтые коридоры. Поверни телефон горизонтально для игры.</p><p class="small">Слева — движение. Справа — осмотр.</p><button id="play">▶ Начать игру</button></div></div>
<div id="rotate"><div><div style="font-size:54px">📱 ↻</div><h2>Поверни телефон горизонтально</h2><p>Игра сделана для альбомного режима.</p></div></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.querySelector('#game'), statusEl=document.querySelector('#status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xc7bd70); scene.fog=new THREE.Fog(0xc7bd70,18,70);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,500); camera.rotation.order='YXZ'; camera.position.set(0,1.65,5);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xfff1b2,0x3d3925,2.1));
const light=new THREE.PointLight(0xffe5a0,2.3,30); light.position.set(0,4,0); scene.add(light);
const floorMat=new THREE.MeshStandardMaterial({color:0x7f7842,roughness:1});
const wallMat=new THREE.MeshStandardMaterial({color:0xc8bd68,roughness:1});
const ceilMat=new THREE.MeshStandardMaterial({color:0xb8ad5b,roughness:1});
const fallback=new THREE.Group(); scene.add(fallback);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.06;fallback.add(floor);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(100,100),ceilMat);ceiling.rotation.x=Math.PI/2;ceiling.position.y=4.2;fallback.add(ceiling);
function wall(x,y,z,w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);m.position.set(x,y,z);fallback.add(m)}
// Simple corridor layout as a fallback if the uploaded model fails to load.
for(let i=-5;i<=5;i++){wall(i*5,2,-18,0.25,4,40);wall(-18,2,i*5,40,4,.25)}
for(const [x,z,w,d] of [[-8,-7,12,.3],[5,-4, .3,18],[10,5,12,.3],[-7,8,.3,14],[0,14,18,.3],[-12,1,10,.3]]) wall(x,2,z,w,4,d);
const loader=new GLTFLoader();let loadedModel=false;
loader.load('./backrooms.glb',g=>{
 const model=g.scene;const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());
 const maxDim=Math.max(size.x,size.y,size.z)||1;const scale=24/maxDim;model.scale.setScalar(scale);model.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);
 scene.add(model);fallback.visible=false;loadedModel=true;statusEl.textContent='Карта загружена';
},undefined,e=>{statusEl.textContent='Резервная карта';console.warn('Не удалось загрузить backrooms.glb',e)});
let yaw=0,pitch=0;const move={x:0,y:0};let joyPointer=null,lookPointer=null,lastX=0,lastY=0;const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');
function updateStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.left=(r.width/2-26+dx)+'px';stick.style.top=(r.height/2-26+dy)+'px';move.x=dx/max;move.y=dy/max}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateStick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateStick(e)});
function endJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;move.x=move.y=0;stick.style.left='34px';stick.style.top='34px'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
canvas.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.4)return;lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch-=dy*.003;pitch=Math.max(-1.25,Math.min(1.25,pitch))});
function endLook(e){if(e.pointerId===lookPointer)lookPointer=null}canvas.addEventListener('pointerup',endLook);canvas.addEventListener('pointercancel',endLook);
document.querySelector('#full').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){statusEl.textContent='Поверни телефон вручную'}});
document.querySelector('#play').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}document.querySelector('#start').style.display='none'});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);camera.rotation.set(pitch,yaw,0);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const speed=4.2*dt;camera.position.addScaledVector(forward,-move.y*speed);camera.position.addScaledVector(right,move.x*speed);camera.position.y=1.65;light.position.set(camera.position.x,3.6,camera.position.z);renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
